name: CI

# 每次推送到 master / PR：构建（精简版）→ 测试 → 脱敏审计 → UI 令牌与核心自检 → 上传产物。
# 打 v* tag：走 scripts/package.ps1 构建**两个发布包**（精简版 + 单 exe 完整版）并创建 Release。
#
# 两条硬约束（见 build.ps1 的说明与 2026-10-17 的教训）：
#   ① 发布产物必须是"单 exe 双形态"（内嵌设置界面载荷），否则用户下载到的 exe 点「设置」
#      只会弹"精简版"提示——所以 release job 必须走 build.ps1 -SingleExe，不能只 cmake --build。
#   ② 运行器固定 windows-2022：windows-latest 已随新版 VS 迁移、没有 VS 2022 实例，
#      CMake 的 "Visual Studio 17 2022" 生成器会直接报错（2026-10-17 实测）。
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  windows:
    # 日常门禁：不构建载荷（CI 里没有 build/generated），因此这里是**精简版**形态。
    # 完整版的形态断言在 release job（--ui-info 退出码 0）。
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: 配置 CMake
        run: cmake -S . -B build-m1 -G "Visual Studio 17 2022" -A x64

      - name: 构建（Release，/W4）
        run: cmake --build build-m1 --config Release

      - name: 运行 C++ 测试
        shell: pwsh
        run: |
          $out = & .\build-m1\Release\cnk_tests.exe 2>&1
          $out | Select-String -Pattern 'test cases:|assertions:|Status:' | ForEach-Object { $_.Line }
          $fails = $out | Select-String -Pattern ': ERROR:|: FATAL ERROR:'
          $other = $fails | Where-Object { $_.Line -notmatch 'integrity_test\.cpp' }
          if ($other) {
            $other | ForEach-Object { $_.Line }
            Write-Error "存在非环境性测试失败：$($other.Count) 条"
            exit 1
          }
          Write-Host "仅 integrity_test 失败（CI 账户无写完整性标签权限，属环境性）"

      - name: 精简版形态自检（无内嵌载荷 → 必须退出 3）
        shell: pwsh
        run: |
          # 主程序是 GUI 子系统（开机不闪控制台窗口）：PowerShell 直接调用既拿不到输出、
          # 也不等它结束（$LASTEXITCODE 不可信），必须重定向捕获（见 scripts/invoke_cli.ps1）
          . .\scripts\invoke_cli.ps1
          $r = Invoke-CnkCli -Exe '.\build-m1\Release\CampusNet-Keeper.exe' -CliArgs @('--ui-info')
          $r.Lines | ForEach-Object { $_ }
          if ($r.ExitCode -ne 3) {
            Write-Error "--ui-info 应返回 3（本构建没有 build/generated 载荷），实际 $($r.ExitCode)"
            exit 1
          }
          exit 0

      - name: 证据脱敏审计
        shell: pwsh
        env:
          # 脚本会往 stdout 打中文，而 Windows 运行器控制台默认是 cp1252/cp437：
          # 不强制 UTF-8 会抛 UnicodeEncodeError 让脚本非零退出（2026-10-17 实测的 CI 失败原因）。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python docs/evidence/audit_redaction.py
          if ($LASTEXITCODE -ne 0) { Write-Error "证据文件未通过脱敏审计"; exit 1 }

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建 Avalonia UI + 核心自检
        shell: pwsh
        run: |
          $env:DOTNET_CLI_HOME = "$PWD\build-ui\dotnet-home"
          $env:NUGET_PACKAGES  = "$PWD\build-ui\nuget"
          $env:DOTNET_NOLOGO = '1'
          dotnet build src/ui/ContractCheck -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build src/ui/CampusNet.UI -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 核心自检（配置镜像 / 密码规则 / 运营商合并）
        shell: pwsh
        run: |
          & .\build-ui\bin\CampusNet.UI.ContractCheck\Release\net10.0-windows\CampusNet.UI.ContractCheck.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: UI 令牌层静态检查（不依赖编译器）
        shell: pwsh
        run: |
          pwsh -File tools/check_ui_tokens.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          # 名字里写明 lite：这里没有内嵌界面载荷，完整版在 Release 里
          name: CampusNet-Keeper-lite-win-x64
          path: |
            build-m1/Release/CampusNet-Keeper.exe
            build-m1/Release/cnk_tests.exe
            build-m1/Release/cnk_ipc_probe.exe

  router:
    # 路由器端子工程（`router/`）：编 aarch64-musl 静态二进制，供 OpenWrt 路由器部署
    #（目标机实测：京东云亚瑟 AX1800 Pro / IPQ6000 / aarch64 / 512 MB RAM）。
    #
    # 为什么在 CI 编：作者本机没有 gcc/zig/clang，Docker 也不常开；这里用 musl.cc 的
    # 预编译工具链，一次装好就能出**静态**二进制（不依赖路由器上的 libc 版本）。
    # 先编本机版跑自检 + e2e（证明代码是对的），再交叉编 —— 顺序很重要：
    # 交叉产物在 x86 runner 上跑不起来，不能拿它当验证。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 本机编译 + 自检 + 端到端
        run: |
          cd router
          make OUT=build-ci
          ./build-ci/cnkrouter --selftest
          python3 tests/e2e_test.py ./build-ci/cnkrouter

      - name: 安装 aarch64-musl 交叉工具链
        run: |
          curl -fsSL -o /tmp/tc.tgz https://musl.cc/aarch64-linux-musl-cross.tgz
          sudo tar -xzf /tmp/tc.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version | head -1

      - name: 交叉编译（静态，不依赖路由器 libc）
        run: |
          cd router
          # OUT 用独立目录：不去动仓库里的 build/（那里有本地 Windows 产物）
          make OUT=build-aarch64 CROSS=aarch64-linux-musl- CC=gcc STATIC=1
          file build-aarch64/cnkrouter
          ls -l build-aarch64/cnkrouter

      - name: 上传 aarch64 产物
        uses: actions/upload-artifact@v4
        with:
          name: cnkrouter-aarch64-musl
          path: router/build-aarch64/cnkrouter

  release:
    # 打 tag（v*）时构建两个发布包并创建 Release：
    #   · 精简版：~1 MB，需目标机装 .NET 10 运行时才有设置界面
    #   · 完整版：单 exe 双形态（内嵌界面载荷，约 24 MB）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 导入代码签名证书（可选）
        shell: pwsh
        env:
          # 仓库 Settings → Secrets and variables → Actions 配这两个 secret 即启用签名：
          #   CODESIGN_PFX_BASE64   代码签名证书 PFX 的 base64
          #                          Windows 生成： [Convert]::ToBase64String([IO.File]::ReadAllBytes('codesign.pfx'))
          #   CODESIGN_PFX_PASSWORD PFX 密码
          # 没配置 → 本次发布**不签名**（见 README「数字签名」）。
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "未配置 CODESIGN_PFX_BASE64 secret：本次发布不签名（自签名证书不适合公开发布）"
            exit 0
          }
          if (-not $env:PFX_PASSWORD) {
            Write-Error "配置了 CODESIGN_PFX_BASE64 但没有 CODESIGN_PFX_PASSWORD"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "CNK_SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CNK_SIGN_PFX_PASSWORD=$env:PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "已导入签名证书（PFX 来自 secrets，不落库）"

      - name: 校验 tag 与 Version.h 一致
        shell: pwsh
        run: |
          $raw = Get-Content -Raw src/native/core/Version.h
          $m = [regex]::Match($raw, 'VersionString\(\)\s*\{\s*return\s*"([^"]+)"')
          if (-not $m.Success) { Write-Error "无法解析 Version.h 的版本号"; exit 1 }
          $want = "v" + $m.Groups[1].Value
          if ($want -ne "${{ github.ref_name }}") {
            Write-Error "tag（${{ github.ref_name }}）与 Version.h（$want）不一致：请先改版本号再打 tag"
            exit 1
          }
          Write-Host "版本一致：$want"

      - name: 构建两个发布包（走 scripts/package.ps1）
        shell: pwsh
        run: |
          $pkgArgs = @('-NoProfile', '-File', 'scripts/package.ps1', '-Version', "${{ github.ref_name }}")
          # 上一步导入过证书（CNK_SIGN_PFX_PATH 经 GITHUB_ENV 提供）才签名
          if ($env:CNK_SIGN_PFX_PATH) { $pkgArgs += '-Sign' }
          & pwsh @pkgArgs
          if ($LASTEXITCODE -ne 0) { Write-Error "打包失败"; exit 1 }

      - name: 签名复核（有签名时）
        shell: pwsh
        run: |
          if (-not $env:CNK_SIGN_PFX_PATH) { Write-Host "未签名，跳过"; exit 0 }
          $failed = 0
          Get-ChildItem dist -Filter '*.zip' | ForEach-Object {
            $tmp = Join-Path $env:RUNNER_TEMP $_.BaseName
            Expand-Archive $_.FullName -DestinationPath $tmp -Force
            $exe = Join-Path $tmp 'CampusNet-Keeper.exe'
            $sig = Get-AuthenticodeSignature $exe
            Write-Host ("{0}: {1} / {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if (-not $sig.SignerCertificate) { $failed++ }
          }
          if ($failed -gt 0) { Write-Error "$failed 个发布包里的 exe 没有签名"; exit 1 }
          exit 0

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist/*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
